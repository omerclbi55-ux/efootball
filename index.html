<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball Ultra İlk 11 Draft Oyunu</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 5px;
        }
        .dashboard {
            background: linear-gradient(135deg, #1e3799, #0c2461);
            padding: 15px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 20px;
            border: 3px solid #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .dashboard h2 {
            margin: 0;
            font-size: 24px;
        }
        .score-box {
            font-size: 32px;
            font-weight: bold;
            color: #4cd137;
            text-shadow: 1px 1px 5px #000;
        }
        .pitch {
            background-color: #27ae60;
            background-image: linear-gradient(rgba(255,255,255,0.1) 50%, transparent 50%),
                              linear-gradient(90deg, rgba(255,255,255,0.1) 50%, transparent 50%);
            background-size: 100px 100px;
            border: 5px solid white;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        .squad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        /* Kaleci tam ortalansın diye özel ayar */
        .gk-container {
            grid-column: span 3;
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .position-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px dashed #f1c40f;
            border-radius: 10px;
            padding: 10px;
            min-height: 120px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .position-card:hover {
            transform: scale(1.05);
            background: rgba(0, 0, 0, 0.85);
        }
        .pos-title {
            font-weight: bold;
            color: #f1c40f;
            font-size: 14px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .player-placeholder {
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
        }
        .chosen-player {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: black;
            font-weight: bold;
            border-radius: 8px;
            padding: 5px;
            border: 2px solid white;
        }
        .chosen-rating {
            background: black;
            color: #f1c40f;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 14px;
